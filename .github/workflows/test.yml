name: Tests

# The full suite (typecheck, build, unit tests and the process-level flows) on every push to main. The release workflow looks up THIS
# workflow's result for the exact commit it releases and does not run the suite again when that run is green
# (src/release/testGate.ts, DEVELOPMENT.md § Releases). Keep the file name: the release looks the runs up by it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # corepack BEFORE setup-node: the repo pins Yarn 4 in `packageManager`, the runner's global Yarn is 1.x.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # The flows drive real tmux sessions; the remote-run flow a real loopback sshd and rsync (remoteRunE2e.test.ts, remoteRunLifecycleE2e.test.ts).
      # ...and fakeroot: the admin pairing line's flow plays root with it (runnerAdminLineE2e.test.ts).
      - name: Install tmux, openssh-server, rsync and fakeroot
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux openssh-server rsync fakeroot
      # ...and Pueue, the runner's job queue: two static binaries, pinned by checksum (the remote-run flow never skips in CI).
      - name: Install Pueue
        run: |
          set -euo pipefail
          base=https://github.com/Nukesor/pueue/releases/download/v4.0.4
          mkdir -p "$HOME/.local/bin"
          # github.com answers a release download with a 502/503/504 now and then: retry those (the checksums below still decide whether the file is the right one).
          download() { curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -m 180 --connect-timeout 60 -o "$2" "$1"; }
          download "$base/pueue-x86_64-unknown-linux-musl" "$HOME/.local/bin/pueue"
          download "$base/pueued-x86_64-unknown-linux-musl" "$HOME/.local/bin/pueued"
          echo "c1b10d7e4e62211075ddd0e1dc3e8cbfc5a43d662cb3be7402a28504e23fcb51  $HOME/.local/bin/pueue" | sha256sum -c -
          echo "5afeff6adbafb909e8d54e2caff158e6966c2adffa2c09e60fd631cc51b60390  $HOME/.local/bin/pueued" | sha256sum -c -
          chmod +x "$HOME/.local/bin/pueue" "$HOME/.local/bin/pueued"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The STT sidecar's Python unit tests run through uv (sttSidecarPython.test.ts).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (setup-uv publishes no v8+ major tags)
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test

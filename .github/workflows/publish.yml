name: Release to npm

# One workflow, three ways in (see DEVELOPMENT.md § Releases):
#   - the daily schedule: decides by itself whether anything shipped changed, tests, packs, publishes, then commits the version and tags;
#   - a manual dispatch (bump / force / dryRun inputs);
#   - a `v*` tag pushed by hand (`npm version <level>` locally, then push main with the tag).
# Publishing uses npm trusted publishing (OIDC, provenance, no npm token anywhere): the package's Trusted
# Publisher on npmjs.com names this repository, this file name and the `release` environment.
#
# gate → test (only when no Tests run covers the commit) → package → check-install → publish → release. npm gets the version BEFORE
# the repository does: until `publish`, nothing leaves the run — a red job publishes nothing, tags nothing, pushes nothing, and the next
# run starts over. `release` (the release commit on the tested one, the tag, main, the GitHub Release) runs only once npm has the
# version, and commits the files of the very tarball npm has. When `release` fails, npm has a version the repository does not: every
# later run refuses until the release is finished — `gate` when it would release another version, `package` when it packs another
# tarball of that one (DEVELOPMENT.md § Releases).
#
# Rights: only `release` can write to the repository, only `publish` can mint the npm publish token. Every job but `test` installs from
# the lockfile with no install scripts (`--mode=skip-build`) and nothing from a cache; `test` is the Tests workflow itself (every install
# script, the suite), can neither write nor publish, and hands nothing on but its result. `publish` checks out nothing and installs
# nothing but the pinned npm, with no scripts: it checks the tarball's sha256 and publishes THAT file. In `release` the token is in the
# environment of two steps only — the push (plain git) and the GitHub Release (`gh`) —; the release CLI that makes the commit runs in a
# step of its own, without it. What runs in that job is pinned by hash (Yarn by `packageManager`, its packages by `yarn.lock`, the
# actions by commit), but a process an earlier step left behind runs as the same user and could still read a later step's token: the
# job is the boundary, not the step. npm is pinned to an exact version.
#
# The jobs are ONE run on purpose: a tag pushed with GITHUB_TOKEN does not start another workflow run, so the release's own tag push
# cannot publish twice.
#
# The suite is not run here when the exact commit already passed in the `Tests` workflow (test.yml, every push to main): the
# release looks that run up by the commit's SHA. Passed → go on; no run at all → run the suite here; red or still running → the
# daily run releases nothing that day (green, with the reason), a dispatch or a hand-pushed tag fails. The release commit may
# differ from the tested one only in package.json's version line, the shrinkwrap's two and CHANGELOG.md — checked before packing and
# again before committing. A hand-pushed tag is gated through its PARENT's run when the tag is only that bump (its own run is
# usually still going).
on:
  schedule:
    # 09:17 Tbilisi, off the top of the hour: GitHub delays scheduled runs at :00.
    - cron: '17 9 * * *'
      timezone: Asia/Tbilisi
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump. auto = from the commits since the last release; a major is released only here, with bump=major.'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      force:
        description: 'Release even when the skip rules say there is nothing to release (never past the breaking-change guard of auto).'
        type: boolean
        default: false
      dryRun:
        description: 'Everything except the npm publish, the push and the GitHub Release; prints the plan, the CHANGELOG diff, the notes and the package and install checks.'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    # What this run releases, and whether the commit's tests passed. No write right, no install script: every later job goes by its
    # outputs. The released commit is always the one the run started on (`github.sha`), never an output.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # the Tests workflow's runs
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      proceed: ${{ steps.gate.outputs.proceed }}
      runSuite: ${{ steps.gate.outputs.runSuite }}
    steps:
      - name: Release only from main
        if: github.event_name != 'push' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main only; this run is on ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan reads the commits since the last tag; a hand-pushed tag is gated through its parent.
          fetch-depth: 0
          persist-credentials: false
      # corepack BEFORE setup-node: the repo pins Yarn 4 in `packageManager`, the runner's global Yarn is 1.x.
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # The release CLI only (tsx): the lockfile, no package's install script.
      - run: yarn install --immutable --mode=skip-build
      - name: Plan the release
        id: plan
        if: github.event_name != 'push'
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_FORCE: ${{ inputs.force }}
        run: yarn tsx src/release/cli.ts plan --bump "${INPUT_BUMP:-auto}" --force "${INPUT_FORCE:-false}"
      - name: The version and the tag
        id: release
        if: github.event_name == 'push' || steps.plan.outputs.kind == 'release'
        env:
          PLANNED: ${{ steps.plan.outputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            version="$(node -p "require('./package.json').version")"
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
              exit 1
            fi
          else
            version="${PLANNED}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      # npm holding a version newer than every release tag but this run's own means a release published and did not finish: releasing
      # another version now would lose that one for good (its bump moves package.json past it). The run stops until it is finished.
      - name: No unfinished release on npm
        if: steps.release.outcome == 'success'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: yarn tsx src/release/cli.ts check-registry --version "${VERSION}"
      # The exact commit this run releases: what the Tests workflow says about it decides everything below. A hand-pushed tag's commit was
      # pushed this very moment, so its own Tests run is usually still going: when its PARENT passed and the tag differs from it only in
      # the version and the CHANGELOG, the parent's run is the gate (otherwise the tagged commit's own run decides).
      - name: Tests of this commit (the Tests workflow's result)
        id: gate
        if: steps.release.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            yarn tsx src/release/cli.ts test-gate --through-parent
          else
            yarn tsx src/release/cli.ts test-gate
          fi

  test:
    # The suite, only when no Tests run covers the commit: the Tests workflow itself, so it has every tool its flows need. It installs
    # with every package's install script (node-pty's build), can neither write nor publish, and hands on nothing but its result.
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && needs.gate.outputs.runSuite == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  package:
    # The version applied, built, checked and packed: the tarball every later job installs, publishes and commits. No write right, no
    # publish right, no install script, nothing from a cache.
    needs: [gate, test]
    if: ${{ !cancelled() && needs.gate.outputs.proceed == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    outputs:
      # The jobs after this one see only what it hands on (`needs` reaches direct dependencies only).
      name: ${{ steps.manifest.outputs.name }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CHANGELOG of a release with an empty `## Unreleased` lists the commits since the last tag.
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # What is packed here is published: nothing restored from a cache runs in it.
          package-manager-cache: false
      # The same npm as the other jobs, pinned exactly and installed with no scripts: only npm >= 11.10 reports what it would drop from
      # package.json (the dry run below); npm 12 would read no shrinkwrap and pack none (the package check refuses that).
      - run: npm install -g --ignore-scripts 'npm@11.21.1'
      # The lockfile only, and no package's install script: the build needs none (tsc), the tarball holds none of node_modules.
      - run: yarn install --immutable --mode=skip-build
      - name: Apply the version (package.json, npm-shrinkwrap.json, CHANGELOG.md)
        if: github.event_name != 'push'
        run: yarn tsx src/release/cli.ts apply "$VERSION"
      - name: The release is the tested commit plus its version bump
        if: github.event_name != 'push'
        run: yarn tsx src/release/cli.ts verify-delta --base "${GITHUB_SHA}"
      - name: The package carries the release's version
        id: manifest
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${version}" != "${VERSION}" ]; then
            echo "::error::package.json carries ${version}, the release is ${VERSION}."
            exit 1
          fi
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: yarn build
      - name: Release notes (read before publishing, so a missing section fails early)
        run: |
          mkdir -p "${RUNNER_TEMP}/release-package"
          yarn tsx src/release/cli.ts notes "$VERSION" > "${RUNNER_TEMP}/release-package/release-notes.md"
      - name: What the release changes
        if: github.event_name != 'push'
        run: |
          {
            echo "### Release ${VERSION}"
            echo
            echo '#### Release notes'
            echo
            cat "${RUNNER_TEMP}/release-package/release-notes.md"
            echo
            echo '#### Version files'
            echo
            echo '```diff'
            git diff -- package.json npm-shrinkwrap.json CHANGELOG.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Package check (contents; the install is the next job's)
        run: yarn tsx src/release/cli.ts check-pack --version "$VERSION" --skip-install
      - name: Pack
        id: pack
        run: |
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/release-package" --json > "${RUNNER_TEMP}/pack.json"
          tarball="$(node -p 'require(process.argv[1])[0].filename' "${RUNNER_TEMP}/pack.json")"
          integrity="$(node -p 'require(process.argv[1])[0].integrity' "${RUNNER_TEMP}/pack.json")"
          sha256="$(sha256sum "${RUNNER_TEMP}/release-package/${tarball}" | cut -d' ' -f1)"
          {
            echo "tarball=${tarball}"
            echo "integrity=${integrity}"
            echo "sha256=${sha256}"
          } >> "$GITHUB_OUTPUT"
          echo "Packed ${tarball}, sha256 ${sha256}"
      # npm has this version already when an earlier attempt published it and did not finish: the same tarball (a re-run) goes on and
      # is not published again; ANOTHER tarball under that version is refused — npm cannot take it, and tagging it would be a lie.
      - name: Already on npm?
        id: published
        env:
          NAME: ${{ steps.manifest.outputs.name }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          published="$(npm view "${NAME}@${VERSION}" dist.integrity 2> /dev/null || true)"
          if [ -z "${published}" ]; then
            echo "isPublished=false" >> "$GITHUB_OUTPUT"
          elif [ "${published}" = "${INTEGRITY}" ]; then
            echo "isPublished=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is on npm already, exactly this tarball (an earlier attempt published it): it is not published again."
          else
            echo "::error title=npm has ${VERSION} from another run::${NAME}@${VERSION} is on npm already, from another tarball than this run's: an earlier release run published it and did not finish (the repository has no v${VERSION}). Finish THAT run (its page is linked from the version's provenance on npmjs.com) with Re-run failed jobs, or by hand: DEVELOPMENT.md § Releases, npm has a version the repository does not. This run publishes and pushes nothing."
            exit 1
          fi
      # npm >= 11.10 drops a bin path written "./dist/…" at publish and only warns (3.3.0 shipped without its command): refuse first.
      - name: npm publish dry run (refuses what npm would drop from package.json)
        if: steps.published.outputs.isPublished != 'true'
        run: yarn tsx src/release/cli.ts check-publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
          if-no-files-found: error
          retention-days: 7

  check-install:
    # Before anything is published: the release commit — the tested commit plus the tarball's version files — merged LOCALLY into main as
    # it stands now (a conflict fails here, not after the publish), then the tarball installed the way a user installs the release: from
    # a registry, by its shrinkwrap (npm then runs the install scripts of the pinned packages). No publish right, no write right.
    needs: [gate, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      TARBALL: ${{ needs.package.outputs.tarball }}
      SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge with main
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g --ignore-scripts 'npm@11.21.1'
      # The release CLI only (tsx): no package's install script.
      - run: yarn install --immutable --mode=skip-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: The tarball is the one the package job packed
        run: echo "${SHA256}  ${RUNNER_TEMP}/release-package/${TARBALL}" | sha256sum -c -
      - name: The release commit merges into main (here only; nothing is pushed)
        if: github.event_name != 'push'
        run: yarn tsx src/release/cli.ts commit-release "$VERSION" --check --tarball "${RUNNER_TEMP}/release-package/${TARBALL}" --base "${GITHUB_SHA}"
      - name: Install check
        run: yarn tsx src/release/cli.ts check-install --tarball "${RUNNER_TEMP}/release-package/${TARBALL}" --version "$VERSION"

  publish:
    # npm gets the version: the tarball the package job packed and the install check installed. The only job that can mint the publish
    # token; it checks out nothing and installs nothing but the pinned npm, with no scripts. Not in a dry run.
    needs: [gate, package, check-install]
    if: ${{ !cancelled() && needs.check-install.result == 'success' && inputs.dryRun != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write # npm trusted publishing (OIDC)
    env:
      NAME: ${{ needs.package.outputs.name }}
      VERSION: ${{ needs.gate.outputs.version }}
      TARBALL: ${{ needs.package.outputs.tarball }}
      SHA256: ${{ needs.package.outputs.sha256 }}
      INTEGRITY: ${{ needs.package.outputs.integrity }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14; an exact version, with no scripts.
      - run: npm install -g --ignore-scripts 'npm@11.21.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: The tarball is the one the package job packed (and the install check installed)
        run: echo "${SHA256}  ${RUNNER_TEMP}/release-package/${TARBALL}" | sha256sum -c -
      # A re-run after the publish went through finds the same tarball on npm and goes on; another tarball under the version is refused.
      - name: Publish to npm
        working-directory: ${{ runner.temp }}/release-package
        run: |
          published="$(npm view "${NAME}@${VERSION}" dist.integrity 2> /dev/null || true)"
          if [ -z "${published}" ]; then
            npm publish "./${TARBALL}" --provenance --access public
          elif [ "${published}" = "${INTEGRITY}" ]; then
            echo "${NAME}@${VERSION} is on npm already, exactly this tarball (a re-run after the publish went through): not published again."
          else
            echo "::error::${NAME}@${VERSION} is on npm already, from another tarball; nothing is published."
            exit 1
          fi

  release:
    # Once npm has the version, the repository gets it: the release commit (the tested commit plus the version files out of the very
    # tarball npm has), the tag, main, then the GitHub Release. The only job that can write; it runs no install script, its checkout keeps
    # no credentials, and the token is in the environment of the plain-git push step and the Release step only. A hand-pushed tag is in
    # the repository already: only its GitHub Release is made here.
    needs: [gate, package, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the release commit, the tag, main, the GitHub Release
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      TARBALL: ${{ needs.package.outputs.tarball }}
      SHA256: ${{ needs.package.outputs.sha256 }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: The tarball is the one npm has (the one the package job packed)
        run: echo "${SHA256}  ${RUNNER_TEMP}/release-package/${TARBALL}" | sha256sum -c -
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'push'
        with:
          fetch-depth: 0 # the merge with main
          persist-credentials: false
      - if: github.event_name != 'push'
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'push'
        with:
          node-version: 22
          package-manager-cache: false
      # The release CLI only (tsx): the lockfile, no package's install script.
      - if: github.event_name != 'push'
        run: yarn install --immutable --mode=skip-build
      # No token here: the release CLI (tsx, esbuild, zod, Yarn — each pinned by hash) makes the commit and the tag and merges a moved
      # main, all locally; it says whether a re-run finds the tag pushed already.
      - name: Commit the version, tag it, merge main if it moved (locally, no token)
        id: prepare
        if: github.event_name != 'push'
        run: yarn tsx src/release/cli.ts commit-release "$VERSION" --prepare --tarball "${RUNNER_TEMP}/release-package/${TARBALL}" --base "${GITHUB_SHA}"
      # The only step with the push token: plain git, no package's code. The token reaches git as an http header through this step's
      # environment (masked); no file keeps it. A push refused because main moved in the seconds since the merge: re-run failed jobs.
      - name: Push main and the tag
        if: github.event_name != 'push' && steps.prepare.outputs.isPushed != 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          basic="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${basic}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
          if ! git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"; then
            echo "::error title=npm has ${VERSION}, the repository not yet::The push of ${TAG} was refused. npm has ${VERSION} already: re-run this run's failed jobs (the release job merges main again and pushes), or finish by hand (DEVELOPMENT.md § Releases, npm has a version the repository does not)."
            exit 1
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="${RUNNER_TEMP}/release-package/release-notes.md"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file "${notes}"
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file "${notes}"
          fi

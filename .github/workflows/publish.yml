name: Release to npm

# One workflow, three ways in (see DEVELOPMENT.md § Releases):
#   - the daily schedule: decides by itself whether anything shipped changed, tests, bumps, tags, publishes;
#   - a manual dispatch (bump / force / dryRun inputs);
#   - a `v*` tag pushed by hand (`npm version <level>` locally, then push main with the tag).
# Publishing uses npm trusted publishing (OIDC, provenance, no npm token anywhere): the package's Trusted
# Publisher on npmjs.com names this repository, this file name and the `release` environment.
#
# prepare, package, check-install and publish are jobs of ONE run on purpose: a tag pushed with GITHUB_TOKEN does not start
# another workflow run, so the bot's own tag push cannot publish twice.
#
# The right to publish (`id-token: write`, npm trusted publishing) is held by `publish` alone, and that job runs no code of the
# repository and installs no package: it downloads the tarball `package` packed, checks its sha256 against the one `package` reported,
# and publishes it. `package` (no publish right, no write right) installs from the lockfile with no install scripts, builds, checks and
# packs; `check-install` (no publish right, no write right) installs that tarball the way a user does — from a registry, by its
# npm-shrinkwrap.json — and checks npm installed exactly the pinned tree. npm itself is pinned, to an exact version, installed with no
# scripts. A pull of an unpinned package with an install script can no longer happen where the publish token can be minted.
#
# The suite is not run here when the exact commit already passed in the `Tests` workflow (test.yml, every push to main): the
# release looks that run up by the commit's SHA. Passed → go on; no run at all → run the suite here; red or still running → the
# daily run releases nothing that day (green, with the reason), a dispatch or a hand-pushed tag fails. The release commit itself may
# differ from the tested one only in package.json's version line and CHANGELOG.md — checked before the tag and before the publish.
# A hand-pushed tag is gated through its PARENT's run when the tag is only that bump (its own run is usually still going).
on:
  schedule:
    # 09:17 Tbilisi, off the top of the hour: GitHub delays scheduled runs at :00.
    - cron: '17 9 * * *'
      timezone: Asia/Tbilisi
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump. auto = from the commits since the last release; a major is released only here, with bump=major.'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      force:
        description: 'Release even when the skip rules say there is nothing to release (never past the breaking-change guard of auto).'
        type: boolean
        default: false
      dryRun:
        description: 'Everything except the push, the npm publish and the GitHub Release; prints the plan, the CHANGELOG diff, the notes and the package check.'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    # Decide, gate, version commit + tag on main. A tag pushed by hand skips this job: its commit is already tagged.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: read # the Tests workflow's runs
    outputs:
      tag: ${{ steps.push.outputs.tag }}
      tested: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main only; this run is on ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # corepack BEFORE setup-node: the repo pins Yarn 4 in `packageManager`, the runner's global Yarn is 1.x.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      # The same npm as the other jobs, pinned exactly and installed with no scripts: only npm >= 11.10 reports what it would drop from
      # package.json (the dry run below); npm 12 would read no shrinkwrap and pack none (the package check refuses that).
      - run: npm install -g --ignore-scripts 'npm@11.21.1'
      - run: yarn install --immutable
      - name: Plan the release
        id: plan
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_FORCE: ${{ inputs.force }}
        run: yarn tsx src/release/cli.ts plan --bump "${INPUT_BUMP:-auto}" --force "${INPUT_FORCE:-false}"
      # The exact commit this run releases: what the Tests workflow says about it decides everything below.
      - name: Tests of this commit (the Tests workflow's result)
        id: gate
        if: steps.plan.outputs.kind == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn tsx src/release/cli.ts test-gate
      - name: Install tmux
        if: steps.gate.outputs.runSuite == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Typecheck
        if: steps.gate.outputs.runSuite == 'true'
        run: yarn typecheck
      # The package check packs dist/, so the build runs whether or not the suite does.
      - name: Build
        if: steps.gate.outputs.proceed == 'true'
        run: yarn build
      - name: Test (unit and flows)
        if: steps.gate.outputs.runSuite == 'true'
        run: yarn test
      - name: Apply the version (package.json, CHANGELOG.md)
        if: steps.gate.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: yarn tsx src/release/cli.ts apply "$VERSION"
      - name: The release is the tested commit plus its version bump
        if: steps.gate.outputs.proceed == 'true'
        env:
          TESTED: ${{ steps.gate.outputs.sha }}
        run: yarn tsx src/release/cli.ts verify-delta --base "$TESTED"
      # The contents, then an install of the packed tree from a loopback registry by its shrinkwrap (pinned versions, no fresh resolution).
      - name: Package check
        if: steps.gate.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: yarn tsx src/release/cli.ts check-pack --version "$VERSION"
      # npm >= 11.10 drops a bin path written "./dist/…" at publish and only warns (3.3.0 shipped without its command):
      # refuse before the tag exists.
      - name: npm publish dry run (refuses what npm would drop from package.json)
        if: steps.gate.outputs.proceed == 'true'
        run: yarn tsx src/release/cli.ts check-publish
      - name: What the release changes
        if: steps.gate.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BUMP: ${{ steps.plan.outputs.bump }}
        run: |
          {
            echo "### Release ${VERSION} (${BUMP})"
            echo
            echo '#### Release notes'
            echo
            yarn tsx src/release/cli.ts notes "$VERSION"
            echo
            echo '#### Version files'
            echo
            echo '```diff'
            git diff -- package.json CHANGELOG.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit, tag and push (not in a dry run)
        id: push
        if: steps.gate.outputs.proceed == 'true' && inputs.dryRun != true
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: yarn tsx src/release/cli.ts commit-release "$VERSION"

  package:
    # After prepare pushed a tag, or for a tag pushed by hand. Never in a dry run (no tag output), never after a red prepare.
    # Builds, checks and packs the tagged commit; holds neither the publish right nor a write right.
    needs: prepare
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.prepare.result == 'success' && needs.prepare.outputs.tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read # the Tests workflow's runs (a hand-pushed tag)
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    outputs:
      # The jobs after this one see only what it hands on (`needs` reaches direct dependencies only).
      tag: ${{ env.TAG }}
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # The tagged commit and its parent: a hand-pushed tag is gated through the parent's Tests run (below).
          fetch-depth: 2
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # What is packed here is published: nothing restored from a cache runs in it.
          package-manager-cache: false
      - run: npm install -g --ignore-scripts 'npm@11.21.1'
      # The lockfile only, and no package's install script: the build needs none (tsc), the tarball holds none of node_modules.
      - run: yarn install --immutable --mode=skip-build
      - name: The tag is the version in package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
      # prepare already gated the tested commit of a scheduled / dispatched release: the tag is that commit plus its version bump.
      - name: The tag is the tested commit plus its version bump
        if: needs.prepare.outputs.tested != ''
        env:
          TESTED: ${{ needs.prepare.outputs.tested }}
        run: |
          git fetch --no-tags --depth=1 origin "${TESTED}"
          yarn tsx src/release/cli.ts verify-delta --base "${TESTED}" --head HEAD
      # A hand-pushed tag has not been gated. Its commit was pushed this very moment, so its own Tests run is usually still going: when
      # its PARENT passed and the tag differs from it only in the version and the CHANGELOG, the parent's run is the gate. Otherwise
      # the tagged commit's own run decides (no run → the suite here; running or red → refused).
      - name: Tests of the tagged commit (the Tests workflow's result, through its parent when the tag is only a version bump)
        id: gate
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn tsx src/release/cli.ts test-gate --through-parent
      - name: Install tmux
        if: steps.gate.outputs.runSuite == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      # The suite needs the native builds (node-pty): only then, and in this job, which can neither publish nor push.
      - name: Install with the builds the suite needs
        if: steps.gate.outputs.runSuite == 'true'
        run: yarn install --immutable
      - name: Typecheck
        if: steps.gate.outputs.runSuite == 'true'
        run: yarn typecheck
      - name: Build
        run: yarn build
      - name: Test (unit and flows)
        if: steps.gate.outputs.runSuite == 'true'
        run: yarn test
      - name: Release notes (read before publishing, so a missing section fails early)
        run: |
          mkdir -p "${RUNNER_TEMP}/release-package"
          yarn tsx src/release/cli.ts notes "$VERSION" > "${RUNNER_TEMP}/release-package/release-notes.md"
      - name: Package check (contents; the install is the next job's)
        run: yarn tsx src/release/cli.ts check-pack --version "$VERSION" --skip-install
      # A re-run after the publish went through and a later step failed: the dry run of a version already on npm fails by itself.
      - name: Already on npm?
        id: published
        run: |
          if npm view "$(node -p "require('./package.json').name")@${VERSION}" version > /dev/null 2>&1; then
            echo "isPublished=true" >> "$GITHUB_OUTPUT"
          else
            echo "isPublished=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npm publish dry run (refuses what npm would drop from package.json)
        if: steps.published.outputs.isPublished != 'true'
        run: yarn tsx src/release/cli.ts check-publish
      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/release-package" --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          sha256="$(sha256sum "${RUNNER_TEMP}/release-package/${tarball}" | cut -d' ' -f1)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "Packed ${tarball}, sha256 ${sha256}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
          if-no-files-found: error
          retention-days: 7

  check-install:
    # The packed tarball installed the way a user installs the release: from a registry, by its shrinkwrap (npm then runs the install
    # scripts of the pinned packages). No publish right, no write right.
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.package.outputs.tag }}
      VERSION: ${{ needs.package.outputs.version }}
      TARBALL: ${{ needs.package.outputs.tarball }}
      SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g --ignore-scripts 'npm@11.21.1'
      # The release CLI only (tsx): no package's install script.
      - run: yarn install --immutable --mode=skip-build
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: The tarball is the one the package job packed
        run: echo "${SHA256}  ${RUNNER_TEMP}/release-package/${TARBALL}" | sha256sum -c -
      - name: Install check
        run: yarn tsx src/release/cli.ts check-install --tarball "${RUNNER_TEMP}/release-package/${TARBALL}" --version "$VERSION"

  publish:
    # Publishes the tarball the package job packed and the install check installed. The only job holding the publish right: it runs no
    # repository code and installs nothing but the pinned npm, with no scripts.
    needs: [package, check-install]
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.check-install.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing (OIDC)
    env:
      TAG: ${{ needs.package.outputs.tag }}
      NAME: ${{ needs.package.outputs.name }}
      VERSION: ${{ needs.package.outputs.version }}
      TARBALL: ${{ needs.package.outputs.tarball }}
      SHA256: ${{ needs.package.outputs.sha256 }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14; an exact version, with no scripts.
      - run: npm install -g --ignore-scripts 'npm@11.21.1'
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: The tarball is the one the package job packed (and the install check installed)
        run: echo "${SHA256}  ${RUNNER_TEMP}/release-package/${TARBALL}" | sha256sum -c -
      - name: Publish to npm
        working-directory: ${{ runner.temp }}/release-package
        run: |
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; not publishing it again (a re-run after a later step failed)."
          else
            npm publish "./${TARBALL}" --provenance --access public
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="${RUNNER_TEMP}/release-package/release-notes.md"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file "${notes}"
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file "${notes}"
          fi

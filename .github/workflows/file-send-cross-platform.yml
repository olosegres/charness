name: File send and PATH lookup on Windows and macOS

# The agent's file sending opens files by the portable `verifiedPath` strategy on Windows and macOS, and the installed-CLI
# check reads PATH (with PATHEXT on Windows) itself. Both differ from Linux exactly where Node's file system does
# (realpath, junctions, inode values, PATHEXT), so their suites run on those systems here. The Linux run is the main
# test suite. The macOS leg also runs the runner script's bash-3.2-only cases: `remoteRun/runner.sh` runs on a Mac under its
# stock /bin/bash 3.2, which reports a background job that SIGTERM ended (bash 5 does not), and only a macOS runner has that bash.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-send:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: corepack enable
      # Native builds (node-pty) are not needed by these suites.
      - run: yarn install --immutable --mode=skip-build
      - run: >-
          node --import tsx --import ./src/__tests__/globalTestSetup.ts --test --test-timeout=120000
          src/__tests__/fileDescriptorProbe.test.ts
          src/__tests__/fileSendService.test.ts
          src/__tests__/fileSendTelegram.test.ts
          src/__tests__/findToolOnPath.test.ts
          src/__tests__/launchToolCommand.test.ts
      # Under /bin/bash (3.2.57, which Apple keeps): the SIGTERM-stopped watcher of the runner script's `exec` must not be reported in a job's
      # output — a case that passes under bash 5, so the Linux run cannot guard it. The WHOLE test file runs, selected by no test name: a
      # selection that matches nothing runs 0 tests and passes. `bash` is put first on PATH as /bin/bash because the tests start `bash`
      # from PATH, and the step fails when that is not a bash 3 (the guard would then guard nothing).
      - name: Runner script under the stock macOS bash 3.2
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          shim_dir="$RUNNER_TEMP/stock-bash"
          mkdir -p "$shim_dir"
          ln -sf /bin/bash "$shim_dir/bash"
          export PATH="$shim_dir:$PATH"
          bash --version | head -n 1
          test "$(bash -c 'echo "${BASH_VERSINFO[0]}"')" = 3 || { echo "::error::/bin/bash is not bash 3, this step guards the Mac's bash"; exit 1; }
          node --import tsx --import ./src/__tests__/globalTestSetup.ts --test --test-timeout=120000 \
            src/__tests__/remoteRunRunnerScriptBounded.test.ts

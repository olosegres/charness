# The whole bot in one container (README "Run with Docker"): the bot, tmux, every agent it starts, OpenCode and
# the bot's MCP server. Build the image once from the checkout this file mounts:
#
#   docker build -t telegramcode <checkout>/docker
#
# Copy .env.example to .env next to this file and fill in the paths. The bot's own settings and tokens are NOT
# here: they live in your instance env file (INSTANCE_ENV_FILE), which the container reads read-only. Every host
# path that file names (DATA_DIR, WORK_ROOT, TMUX_TMPDIR, …) is mounted at the SAME path: TELEGRAMCODE_DATA_DIR
# and TELEGRAMCODE_WORK_ROOT are its DATA_DIR and WORK_ROOT (prefixed, because compose prefers a variable your
# shell exports over .env).
#
# A second instance: copy the service with its own name, hostname, checkout, home, data dir and env file
# (another bot token and group). Ports and tmux servers are private to each container.
#
# Never `docker compose restart` — it ignores depends_on; use `docker compose down && docker compose up -d`.
# To restart only the bot (agents keep running): docker exec telegramcode-main telegramcode-restart-bot

services:
  telegramcode:
    image: telegramcode
    container_name: telegramcode-main
    # Fixed: the instance lock tells this container's own restarts from another machine by it.
    hostname: telegramcode-main
    restart: unless-stopped
    # The bot flushes its state and releases its lock before it exits.
    stop_grace_period: 60s
    # Rootful Docker only: run as your own user (rootless Docker maps the container's root to you already).
    # user: "${UID}:${GID}"
    volumes:
      - ${CHECKOUT}:/opt/telegramcode
      - ${AGENTS_HOME}:/home/telegramcode
      - ${TELEGRAMCODE_DATA_DIR}:${TELEGRAMCODE_DATA_DIR}
      - ${TELEGRAMCODE_WORK_ROOT}:${TELEGRAMCODE_WORK_ROOT}
      - ${INSTANCE_ENV_FILE}:${INSTANCE_ENV_FILE}:ro
    environment:
      - ENV_FILE=${INSTANCE_ENV_FILE}
